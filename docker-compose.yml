# plume — lecteur de mails Gmail
#
# La base PostgreSQL n'est PAS declaree ici : elle tourne deja sur le NAS
# (192.168.1.30:5434) et heberge d'autres applications. Seul le conteneur web
# est cree par ce fichier.
#
# Les volumes de donnees sont des bind mounts vers des chemins locaux du NAS.
# Ne jamais y pointer un partage SMB : PostgreSQL refuse un systeme de fichiers
# reseau, et meme les pieces jointes y seraient fragiles.

name: plume

services:
  web:
    build: .
    image: plume:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_LOG_LEVEL: info
      # Cle de session : a generer, de longue valeur, propre a cette instance.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?definir SECRET_KEY_BASE dans le fichier .env}
      # Connexion a la base existante du NAS
      PLUME_DB_HOST: ${PLUME_DB_HOST:-192.168.1.30}
      PLUME_DB_PORT: ${PLUME_DB_PORT:-5434}
      PLUME_DB_USER: ${PLUME_DB_USER:-postgres}
      PLUME_DB_PASSWORD: ${PLUME_DB_PASSWORD:?definir PLUME_DB_PASSWORD dans le fichier .env}
      PLUME_DB_NAME: ${PLUME_DB_NAME:-plume_production}
      # Repertoire de stockage des pieces jointes
      PLUME_DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s